{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags for responsive design -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

    <title>Recipe Archive</title>
</head>
<body>
    <div class="container">
        <!-- User profile section -->
        <div class="row">
            <div class="col-md-6">
                <h1>{{ user.username }}</h1>
            </div>
            <div class="col-md-6">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="file" name="profile_picture">
                    <button type="submit">Upload</button>
                </form>
            </div>
        </div>

        <!-- Recipe section -->
        <div class="row">
            <!-- Add new recipe block -->
            <div class="col-md-4">
                <div class="card">
                    <img src="{% static 'images/add-recipe.png' %}" class="card-img-top" alt="Add new recipe">
                    <div class="card-body">
                        <a href="/add-recipe/" class="btn btn-primary">Add New Recipe</a>
                    </div>
                </div>
            </div>

            <!-- Existing recipes blocks -->
            {% for recipe in recipes %}
            <div class="col-md-4">
                <div class="card">
                    <img src="{{ recipe.image.url }}" class="card-img-top" alt="{{ recipe.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ recipe.title }}</h5>
                        <p class="card-text">{{ recipe.description }}</p>
                        <a href="/recipe/{{ recipe.id }}" class="btn btn-primary">View Recipe</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
