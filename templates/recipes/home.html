{% extends 'base_generic.html' %}
{% load static %}
{% block content %}

    <head>
        <!-- Add this line in the head section of your HTML to include Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
        <link rel="stylesheet" href="{% static 'css/custom.css' %}" />

    </head>


    <div class="container">
        <!-- User profile section -->
        <div class="row">
            <div class="col-md-6">
                <h1>{{ user.username }}</h1>
            </div>
        </div>
    <form method="GET" action="{% url 'home' %}">
    <select name="meal_type">
        <option value="">All Meal Types</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Lunch">Lunch</option>
        <option value="Dinner">Dinner</option>
        <option value="Dessert">Dessert</option>
        <option value="Drink">Drink</option>
        <option value="Other">Other</option>
    </select>

    <input type="submit" value="Filter">
</form>

        <!-- Buttons Row -->
        <div class="row mt-4">
            <div class="col-md-12 d-flex align-items-center justify-content-start"> <!-- d-flex makes the div a flex container, align-items-center vertically aligns the buttons, and justify-content-start aligns them to the start -->
                <a href="{% url 'view_mealplans' %}" class="btn btn-custom">Meal Plan</a>
                <a href="{% url 'discover' %}" class="btn btn-custom">Discover</a>
            </div>
        </div>



        <!-- Recipe section -->
        <div class="row d-flex ">
            <!-- Add new recipe block -->
            <div class="col-md-4 d-flex recipe-row">
                <div class="card flex-grow-1 d-flex flex-column">
                    <a href="{% url 'add_recipe' %}" class="d-block text-center p-4">
                        <i class="fas fa-plus-circle fa-3x"></i> <!-- This is the Font Awesome icon -->
                        <h4>Add New Recipe</h4>
                    </a>
                </div>
            </div>

            <!-- Existing recipes blocks -->
            {% for recipe in recipes %}
            <div class="col-md-4 d-flex recipe-row">
                <div class="card flex-grow-1 d-flex flex-column">
                    {% if recipe.image %}
                        <a href="/recipe/{{ recipe.id }}" class="img-container" style="background-image: url({{ recipe.image.url }});"></a>
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ recipe.name }}</h5>
                        <p>{{ recipe.rating }} &#9733;</p>
                        <p>{{ recipe.meal_type }}</p>
                        <a href="/recipe/{{ recipe.id }}" class="btn btn-custom">View Recipe</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
