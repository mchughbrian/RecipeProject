{% extends 'base_generic.html' %}

{% block content %}
<div class="container mealplans-view">
    <h1>Your Meal Plans</h1>
    <a href="{% url 'create_mealplan' %}" class="btn btn-custom">Create Meal Plan</a>

    <div class="mealplans-list">
        {% for mealplan in mealplans %}
            <div class="mealplan-item">
                <h2>{{ mealplan.name }}</h2>
                <div class="mealplan-actions">
                    <a href="{% url 'mealplan_detail' mealplan_id=mealplan.id %}" class="action-link">View</a>
                    <a href="{% url 'edit_mealplan' mealplan_id=mealplan.id %}" class="action-link">Edit</a>
                    <a href="{% url 'delete_mealplan' mealplan_id=mealplan.id %}" class="action-link">Delete</a>
                </div>
            </div>
        {% empty %}
            <p>You have no meal plans. Start by <a href="{% url 'create_mealplan' %}" class="btn btn-custom">creating a new one</a>.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
