{% extends 'base_generic.html' %}

{% block content %}
<h2>Manage Subscription</h2>

<div class="subscription-details">
    <p><strong>Current Subscription:</strong> {{ current_subscription }}</p>
    <p><strong>Next Billing Date:</strong> {{ next_bill_date }}</p>
    <p><strong>Price:</strong> ${{ price }}</p>
</div>

<!-- Cancel Subscription Button -->
<button id="cancelButton">Cancel Subscription</button>

<!-- Confirmation Modal/Popup (Hidden initially) -->
<div id="confirmationModal" style="display:none;">
    <p>Are you sure you want to cancel your subscription?</p>
    <button id="confirmCancel">Yes, Cancel</button>
    <button id="keepSubscription">No, Keep It</button>
</div>

    <form id="cancelSubscriptionForm" method="post" action="{% url 'cancel_subscription' %}" style="display: none;">
    {% csrf_token %}
    <!-- Any additional data you might need to send can be included here -->
    </form>


<script>
    // When the 'Cancel Subscription' button is clicked, show the modal
    document.getElementById('cancelButton').addEventListener('click', function() {
        document.getElementById('confirmationModal').style.display = 'block';
    });

    // When the 'No, Keep It' button is clicked, hide the modal
    document.getElementById('keepSubscription').addEventListener('click', function() {
        document.getElementById('confirmationModal').style.display = 'none';
    });

    // When the 'Yes, Cancel' button is clicked, submit the form
    document.getElementById('confirmCancel').addEventListener('click', function() {
        // Submit the form to handle the cancellation
        document.getElementById('cancelSubscriptionForm').submit();
    });
</script>


{% endblock %}
