{% extends 'base_generic.html' %}
{% load static %}

{% block content %}
<div class="login-container">
    <div class="login-section">
        <div class="login-image">
            <!-- You can use a different image or the same one as in the login page -->
            <img src="{% static 'images/Logon2.png' %}" alt="Registration Image">
        </div>
        <div class="login-form">
            <h2>Register</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-custom">Register</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
